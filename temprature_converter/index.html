<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Temprature converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mydiv">
        <h2>Temprature conversion:</h2>
        <input type="number"  id="temp" value="0"><br>

        <input type="radio" for="cel_to_fahr" id="cel_to_fahr" name="choice">
        <label id="cel_to_fahr">Celsius  to Fahrenheit</label><br>

        <input type="radio" for="fahr_to_cel" id="fahr_to_cel" name="choice">
        <label id="cel_to_far">Fahrenheit to Celsius</label><br><br>

        <button id="submit">Submit</button><br>
        
        <label id="answer"></label>
    </div>   
<script src="index.js"></script>    
</body>
</html>
