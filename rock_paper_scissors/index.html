<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>ROCK PAPER SCISSORS</title>
    <link rel="stylesheet"  href="style.css">
</head>
<body>
    <h1>ROCK-PAPER-SCISSORS GAME</h1>
    <div id="container">
        <button class="choice" id="rock" onclick="playgame('rock')">✊</button>
        <button class="choice" id="paper" onclick="playgame('paper')">🖐️</button>
        <button class="choice" id="scissor" onclick="playgame('scissor')">✌️ </button>
    </div>
    <h2 class="myh2" id="player_display">PLAYER:</h2>
    <h2 class="myh2" id="computer_display">COMPUTER:</h2>
    <h2 id="result"></h1>
    <h3 class="myh3" id="player_score">PLAYER SCORE:</h2>
    <h3 class="myh3" id="computer_score">COMPUTER SCORE:</h2>
    <script src="index.js"></script>   
</body>
</html>
